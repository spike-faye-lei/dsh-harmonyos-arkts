cases:
  - id: objectlink-vs-state
    prompt: "解释 ArkUI 中 ObjectLink 是什么，什么时候用它代替 State？"
    must_include:
      - "Observed"
      - "ObjectLink"
      - "父子组件"
      - "对象属性"
    must_not_include:
      - "useState"
      - "React Hook"

  - id: api26-production-default
    prompt: "帮我写一个生产可用的鸿蒙相机功能方案。"
    must_include:
      - "API 26.0.0"
      - "Release"
      - "module.json5"
      - "API 24"
    must_not_include:
      - "API 26 仅预览"
      - "生产必须使用 Beta SDK"

  - id: api26-release-status
    prompt: "现在鸿蒙最新的 API 基线是什么？API 26 还是 Beta 吗？"
    must_include:
      - "26.0.0"
      - "Release"
      - "API 24"
      - "HarmonyOS 7"
    must_not_include:
      - "API 26 是开发者预览"
      - "没有 Release 版本"

  - id: targetsdk-gating
    prompt: "把 targetSdkVersion 从 24 提到 26.0.0 需要注意什么？"
    must_include:
      - "targetSdkVersion"
      - "26.0.0"
      - "行为变更"
    must_not_include:
      - "改个数字没有影响"

  - id: immersive-material-scope
    prompt: "API 26 的沉浸光感（systemMaterial）在普通组件上为什么不生效？"
    must_include:
      - "沉浸光感"
      - "systemMaterial"
      - "Navigation"
      - "targetSdkVersion"
    must_not_include:
      - "所有组件全页默认生效"

  - id: agent-framework-break
    prompt: "升级到 API 26 后 Agent Framework Kit 编译报错，可能是什么原因？"
    must_include:
      - "AgentOperation"
      - "getClientSessionId"
      - "targetSdkVersion"
    must_not_include:
      - "Agent Framework Kit 没有变更"

  - id: arkts-1.2-interop
    prompt: "ArkTS 1.2 和 TypeScript 之间可以互相调用吗？"
    must_include:
      - "ESObject"
      - "1.2"
      - "互操作"
    must_not_include:
      - "TS 可以直接调用 ArkTS 1.2"
      - "HarmonyOS 26 已默认启用 ArkTS 1.2"

  - id: legacy-api-migration
    prompt: "代码里用了 getContext(this)、router.pushUrl 和 animateTo，需要怎么迁移？"
    must_include:
      - "getUIContext"
      - "getHostContext"
      - "router"
      - "animateTo"
    must_not_include:
      - "getContext(this) 是推荐写法"

  - id: stage-model-new-app
    prompt: "新建鸿蒙应用应该用 FA 模型还是 Stage 模型？"
    must_include:
      - "Stage"
      - "FA"
      - "legacy"
    must_not_include:
      - "新项目优先 FA"

  - id: permission-camera
    prompt: "ArkTS 里申请相机权限怎么写？"
    must_include:
      - "module.json5"
      - "ohos.permission.CAMERA"
      - "requestPermissionsFromUser"
    must_not_include:
      - "AndroidManifest.xml"

  - id: permission-default-web-browser
    prompt: "ohos.permission.DEFAULT_WEB_BROWSER 现在需要申请吗？"
    must_include:
      - "DEFAULT_WEB_BROWSER"
      - "26.0.0"
    must_not_include:
      - "已经强制生效"

  - id: lazyforeach-performance
    prompt: "鸿蒙大列表卡顿怎么优化？"
    must_include:
      - "LazyForEach"
      - "稳定 key"
      - "渲染"
    must_not_include:
      - "RecyclerView"

  - id: arkts-strict-review
    prompt: "帮我 review 一段 ArkTS 代码，看看有没有类型问题。"
    must_include:
      - "strict"
      - "类型"
      - "ArkTS"
    must_not_include:
      - "any 随便用"

  - id: build-error-routing
    prompt: "DevEco Studio 编译报错，我应该先提供哪些信息？"
    must_include:
      - "DevEco Studio"
      - "compileSdkVersion"
      - "module.json5"
      - "oh-package.json5"
    must_not_include:
      - "只重启电脑"

  - id: native-api-compatibility
    prompt: "compatibleSdkVersion 是 API 20，但 Native 代码调用了更高版本 C API，怎样避免低版本设备崩溃？"
    must_include:
      - "APIAVAILABLE"
      - "弱引用"
      - "依赖库"
      - "低版本设备"
    must_not_include:
      - "只判断 SystemCapability"

  - id: linux-ci-pipeline
    prompt: "给我一套 HarmonyOS Linux CI 构建、签名和真机安装的关键步骤。"
    must_include:
      - "JDK 17"
      - "ohpm install"
      - "--no-daemon"
      - "caseSensitiveCheck"
      - "hdc"
    must_not_include:
      - "提交明文签名密码"

  - id: arkts-leak-detection
    prompt: "ArkTS 页面对象疑似泄漏，应该怎么检测？可以在线上长期打开吗？"
    must_include:
      - "jsLeakWatcher"
      - "开发态"
      - "灰度"
    must_not_include:
      - "生产环境长期常驻"

  - id: container-reader-layout
    prompt: "组件需要根据自身容器宽度而不是窗口宽度切换布局，应该用什么？"
    must_include:
      - "ContainerReader"
      - "容器"
      - "断点"
    must_not_include:
      - "只能使用窗口断点"
